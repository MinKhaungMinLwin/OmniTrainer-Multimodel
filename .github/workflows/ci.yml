name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check formatting
        run: uv run black --check multimodal_moderation services tests evals
      - name: Check import ordering
        run: uv run isort --check-only multimodal_moderation services tests evals
      - name: Lint
        run: uv run flake8 multimodal_moderation services tests evals
      - name: Run deterministic tests
        env:
          GEMINI_API_KEY: unit-test-gemini-key
          USER_API_KEY: unit-test-user-key
          DEFAULT_GOOGLE_MODEL: gemini-2.5-flash-lite
        run: uv run pytest
      - name: Enforce release evaluation gate
        run: make release-gate
      - name: Verify migrations
        env:
          OMNI_DATABASE_URL: sqlite+aiosqlite:////tmp/omni-migrations.db
          OMNI_JWT_SECRET: migration-check-secret-with-at-least-32-characters
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --dev
      - run: npm ci
      - name: Verify generated API contracts
        run: |
          uv run python -m services.api.omni_api.openapi
          npm run generate:contracts
          git diff --exit-code -- packages/contracts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: Render stable and canary Kubernetes manifests
        run: |
          kubectl kustomize deploy/kubernetes/base >/tmp/omni-stable.yaml
          kubectl kustomize deploy/kubernetes/canary >/tmp/omni-canary.yaml

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Build and start the platform stack
        run: docker compose --profile platform up -d --build --wait
      - name: Smoke-test the containerized API
        run: curl --fail --silent --show-error http://localhost:8001/health/ready
      - name: Run operations and accessibility end-to-end tests
        run: npm run test:e2e
      - name: Show service state
        if: always()
        run: docker compose --profile platform ps
      - name: Show service logs
        if: failure()
        run: docker compose --profile platform logs --no-color
      - name: Stop the platform stack
        if: always()
        run: docker compose --profile platform down --volumes
