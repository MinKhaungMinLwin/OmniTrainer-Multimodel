services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omni
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
    ports:
      - "5432:5432"
    volumes:
      - omni-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - omni-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omni
      MINIO_ROOT_PASSWORD: omni-development-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - omni-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: alembic upgrade head
    environment: &platform-environment
      OMNI_DATABASE_URL: postgresql+asyncpg://omni:omni@postgres:5432/omni
      OMNI_REDIS_URL: redis://redis:6379/0
      OMNI_JWT_SECRET: local-compose-secret-change-before-production
      OMNI_ALLOW_DEV_AUTH: "true"
      OMNI_STORAGE_BACKEND: s3
      OMNI_S3_ENDPOINT_URL: http://minio:9000
      OMNI_S3_ACCESS_KEY: omni
      OMNI_S3_SECRET_KEY: omni-development-password
      OMNI_S3_BUCKET: omni-attachments
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: python -m services.api.omni_api.seed
    environment: *platform-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: *platform-environment
    ports:
      - "8001:8001"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *platform-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from redis import Redis; Redis.from_url(os.environ['OMNI_REDIS_URL']).ping()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omni-postgres:
  omni-redis:
  omni-minio:
